[project]
name = "pyconway"
version = "0.1.0"
description = "Conway's Game of Life as a terminal UI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "textual>=8.2.8",
]

[project.scripts]
pyconway = "pyconway.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pyconway"]

[dependency-groups]
dev = ["pytest>=8.0"]
